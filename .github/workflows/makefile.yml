name: Build iOS App (Saturn)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Assets Dependencies
      run: |
        pip install mako layouts

    - name: Restore Missing Core SDK Headers
      run: |
        # Fetch the original clean include folder from upstream to restore ultra64.h
        mkdir -p temp_include
        git archive --remote=https://github.com HEAD include | tar -x -C temp_include
        cp -rn temp_include/include/* include/ || true
        rm -rf temp_include

    - name: Pre-build Extraction Tools Natively
      run: |
        cd tools
        make CC=gcc CXX=g++ n64graphics skyconv mio0 aifc_decode aiff_extract_codebook vadpcm_enc extract_data_for_mio textconv patch_libultra_math -j4
        cd ..

    - name: Create Custom Local Tool Override Paths
      run: |
        mkdir -p $GITHUB_WORKSPACE/mock_bin
        echo '#!/bin/bash' > $GITHUB_WORKSPACE/mock_bin/gmake
        echo 'echo "Bypassing gmake sub-call..."' >> $GITHUB_WORKSPACE/mock_bin/gmake
        echo 'exit 0' >> $GITHUB_WORKSPACE/mock_bin/gmake
        chmod +x $GITHUB_WORKSPACE/mock_bin/gmake
        echo "$GITHUB_WORKSPACE/mock_bin" >> $GITHUB_PATH

    - name: Run Game Asset Extractor
      run: |
        python3 extract_assets.py us

    - name: Fix Hardcoded Linux Compiler Paths for Mac
      run: |
        # Pre-create directory paths to satisfy Makefile rules
        mkdir -p build/us_pc build/us_ios
        
        # Point level_rules.mk directly to an empty template to skip the clang preprocessor crash
        touch build/us_pc/level_rules.mk build/us_ios/level_rules.mk
        
        # Force the build configuration files to use native mac preprocessor arguments
        find . -name "Makefile*" -type f -exec sed -i '' 's/cpp-12/cpp/g' {} + || true
        find . -name "Makefile*" -type f -exec sed -i '' 's/cpp-10/cpp/g' {} + || true
        find . -name "Makefile*" -type f -exec sed -i '' 's/-I \./-I\./g' {} + || true

    - name: Compile Custom Saturn App Binary
      run: |
        make TARGET_IOS=1 VERSION=us CPP="cpp -xc" -j4

    - name: Construct Final App Payload Directory
      run: |
        mkdir -p Payload/Saturn.app
        if [ -d "build/us_ios" ]; then
          cp -r build/us_ios/* Payload/Saturn.app/
        elif [ -d "build/us" ]; then
          cp -r build/us/* Payload/Saturn.app/
        else
          echo "Sweeping custom build folder configurations..."
          find build/ -name "*.app" -exec cp -r {}/ Payload/Saturn.app/ \; || true
          find build/ -type f -permalink +111 -exec cp {} Payload/Saturn.app/ \; || true
        fi

    - name: Bind Interactive Onscreen Joystick Templates
      run: |
        cp -r assets/* Payload/Saturn.app/assets/ 2>/dev/null || true
        cp -r res/* Payload/Saturn.app/ 2>/dev/null || true

    - name: Compress and Finalize IPA Sideload Package
      run: |
        chmod +x Payload/Saturn.app/* 2>/dev/null || true
        zip -r Saturn.ipa Payload

    - name: Deploy Completed Installation File
      uses: actions/upload-artifact@v4
      with:
        name: Saturn-iOS-Install-File
        path: Saturn.ipa
