name: Saturn iOS Final Build & Package

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14 # High-confidence runner for native ARM64 compilation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          # sm64ex-based builds on macOS require specific homebrew packages
          brew install gcc make adamstark-audiofile sdl2 glew glfw pkg-config mingw-w64 dylibbundler
          pip install mako layouts

      - name: Restore Core SDK Headers
        run: |
          # Ensures ultra64.h and PR/ultratypes.h are available
          mkdir -p temp_include
          git archive --remote=https://github.com/sm64pc/sm64ex.git HEAD include | tar -x -C temp_include
          cp -rn temp_include/include/* include/ || true
          rm -rf temp_include

      - name: Pre-build Tools
        run: |
          # Manually build tools needed for asset extraction
          cd tools
          make CC=gcc CXX=g++ n64graphics skyconv mio0 aifc_decode aiff_extract_codebook vadpcm_enc extract_data_for_mio textconv patch_libultra_math -j4
          cd ..

      - name: Run Game Asset Extractor
        run: |
          # Uses the baserom.us.z64 in your root for asset extraction
          python3 extract_assets.py us

      - name: Final Native iOS Compilation
        run: |
          # Resolves clang warnings by explicitly passing include directories
          export C_INCLUDE_PATH=$C_INCLUDE_PATH:$(pwd)/include
          make TARGET_IOS=1 VERSION=us CPP="cpp -xc -Iinclude" CCFLAGS="-Iinclude" EXTRA_CFLAGS="-Iinclude" -j4

      - name: Package Payload and IPA
        run: |
          # Manually constructs the .ipa payload structure
          mkdir -p Payload/Saturn.app
          # Find and copy the compiled .app bundle
          find build/ -name "*.app" -exec cp -r {}/ Payload/Saturn.app/ \; || true
          # Ensure custom touch and multiplayer assets are included
          cp -r assets/* Payload/Saturn.app/assets/ 2>/dev/null || true
          cp -r res/* Payload/Saturn.app/ 2>/dev/null || true
          # Final zip as IPA
          chmod +x Payload/Saturn.app/* 2>/dev/null || true
          zip -r Saturn.ipa Payload

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saturn-iOS-App-Package
          path: Saturn.ipa
