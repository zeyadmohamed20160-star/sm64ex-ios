name: Build iOS App (Saturn)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Assets Dependencies
      run: |
        pip install mako layouts

    - name: Pre-build Extraction Tools Natively
      run: |
        cd tools
        make CC=gcc CXX=g++ n64graphics skyconv mio0 aifc_decode aiff_extract_codebook vadpcm_enc tabledesign extract_data_for_mio textconv patch_libultra_math -j4
        cd ..

    - name: Bypass Python Tool Compilation
      run: |
        # We manually modify the python script in place so it skips compiling tools and uses the ones we just built
        sed -i '' 's/subprocess.check_call(\[\x27gmake\x27/#/g' extract_assets.py
        sed -i '' 's/CC=gcc-15/#/g' extract_assets.py
        sed -i '' 's/CXX=g++-15/#/g' extract_assets.py
        # Create a hard gmake link as a backup
        sudo ln -sf /usr/bin/make /usr/local/bin/gmake

    - name: Run Game Asset Extractor
      run: |
        python3 extract_assets.py us

    - name: Compile Custom Saturn App Binary
      run: |
        make TARGET_IOS=1 VERSION=us -j4

    - name: Construct Final App Payload Directory
      run: |
        mkdir -p Payload/Saturn.app
        if [ -d "build/us_ios" ]; then
          cp -r build/us_ios/* Payload/Saturn.app/
        elif [ -d "build/us" ]; then
          cp -r build/us/* Payload/Saturn.app/
        else
          echo "Sweeping custom build folder configurations..."
          find build/ -name "*.app" -exec cp -r {}/ Payload/Saturn.app/ \; || true
          find build/ -type f -permalink +111 -exec cp {} Payload/Saturn.app/ \; || true
        fi

    - name: Bind Interactive Onscreen Joystick Templates
      run: |
        cp -r assets/* Payload/Saturn.app/assets/ 2>/dev/null || true
        cp -r res/* Payload/Saturn.app/ 2>/dev/null || true

    - name: Compress and Finalize IPA Sideload Package
      run: |
        chmod +x Payload/Saturn.app/* 2>/dev/null || true
        zip -r Saturn.ipa Payload

    - name: Deploy Completed Installation File
      uses: actions/upload-artifact@v4
      with:
        name: Saturn-iOS-Install-File
        path: Saturn.ipa
