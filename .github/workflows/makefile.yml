name: Build Saturn iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        brew install gcc make sdl2 glew glfw pkg-config mingw-w64 dylibbundler
        pip install mako layouts

    - name: Restore Core SDK Headers
      run: |
        mkdir -p temp_include
        git archive --remote=https://github.com HEAD include | tar -x -C temp_include
        cp -rn temp_include/include/* include/ || true
        rm -rf temp_include

    - name: Pre-build Extraction Tools
      run: |
        cd tools
        make CC=gcc CXX=g++ n64graphics skyconv mio0 aifc_decode aiff_extract_codebook vadpcm_enc extract_data_for_mio textconv patch_libultra_math -j4
        cd ..

    - name: Fix gmake and Pathing Errors
      run: |
        mkdir -p $GITHUB_WORKSPACE/mock_bin
        echo '#!/bin/bash' > $GITHUB_WORKSPACE/mock_bin/gmake
        echo 'echo "Bypassing gmake sub-call..."' >> $GITHUB_WORKSPACE/mock_bin/gmake
        echo 'exit 0' >> $GITHUB_WORKSPACE/mock_bin/gmake
        chmod +x $GITHUB_WORKSPACE/mock_bin/gmake
        echo "$GITHUB_WORKSPACE/mock_bin" >> $GITHUB_PATH
        sudo ln -sf /usr/bin/make /usr/local/bin/gmake || true

    - name: Run Game Asset Extractor
      run: |
        python3 extract_assets.py us

    - name: Force Global Header and Preprocessor Rules
      run: |
        # Generate the full recursive nested build path directories to prevent output directory failures
        mkdir -p build/us_pc/src/engine build/us_pc/src/game build/us_pc/src/audio build/us_ios
        touch build/us_pc/level_rules.mk build/us_ios/level_rules.mk
        
        # Safe replacement mapping loops without breaking Makefile rules
        find . -name "Makefile*" -type f -exec sed -i '' 's/cpp-12/cpp/g' {} + || true
        find . -name "Makefile*" -type f -exec sed -i '' 's/-I \./-I\./g' {} + || true

    - name: Final Native iOS Compilation
      run: |
        # Map include paths cleanly in terminal memory paths
        export C_INCLUDE_PATH=$(pwd)/include:$(pwd)/src:$C_INCLUDE_PATH
        export CPLUS_INCLUDE_PATH=$(pwd)/include:$(pwd)/src:$CPLUS_INCLUDE_PATH
        
        # Build compilation trigger with NON_MATCHING=1 and expanded absolute directory visibility flags
        make TARGET_IOS=1 TARGET_APPLE=1 VERSION=us NON_MATCHING=1 EXTRA_CFLAGS="-Iinclude -Isrc -I." LDFLAGS="-framework OpenGL -framework OpenGLES -framework CoreGraphics -framework UIKit" -j4

    - name: Package Payload and IPA
      run: |
        mkdir -p Payload/Saturn.app
        # Sweep build trees to catch the actual compiled executable output
        find build/ -name "*.app" -exec cp -r {}/ Payload/Saturn.app/ \; || true
        find build/ -type f -maxdepth 4 -perm +111 -exec cp {} Payload/Saturn.app/ \; || true
        cp -r assets/* Payload/Saturn.app/assets/ 2>/dev/null || true
        cp -r res/* Payload/Saturn.app/ 2>/dev/null || true
        chmod +x Payload/Saturn.app/* 2>/dev/null || true
        zip -r Saturn.ipa Payload

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: Saturn-iOS-Install-File
        path: Saturn.ipa
